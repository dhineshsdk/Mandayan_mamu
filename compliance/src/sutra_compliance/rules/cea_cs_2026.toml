# CEA (Cyber Security in Power Sector) Regulations, 2026 -- obligations as data.
#
# HOW TO CORRECT THIS FILE
# 1. Change the value (a duration, a severity list, a trigger) on the rule concerned.
# 2. When a rule has been checked against the gazette text, set verification = "verified_against_gazette"
#    and fill gazette_clause (for example "Reg 8(3)"). The loader refuses a verified rule with no clause.
# 3. Bump [pack].version. Every assessment, deadline and audit pack records the version it was computed with.
#
# Every rule cites at least one entry from [[sources]]. Nothing here comes from the gazette itself yet:
# the official PDF could not be read when this pack was written (see the research note), so every rule is
# "unverified_against_gazette" until someone checks it.
#
# Durations are written as tables of months, weeks, days and hours. Months are calendar months; a date that
# does not exist in the target month moves to that month's last day (31 Jan + 1 month = 28 or 29 Feb).

[pack]
id = "cea-cs-2026"
title = "Central Electricity Authority (Cyber Security in Power Sector) Regulations, 2026"
version = "2026.10.11.1"
jurisdiction = "IN"
notification = "Gazette of India Extraordinary, Part III, Section 4, No. 484, dated 31 July 2026"
enabling_provision = "Section 177 of the Electricity Act, 2003"
in_force_from = 2027-04-01
# India Standard Time. Dates in this pack (deadlines, financial years) are Indian calendar dates.
utc_offset_minutes = 330
financial_year_start_month = 4
verification = "unverified_against_gazette"
verification_note = """
Compiled from secondary summaries (consultants, vendors, trade press) cross-checked against each other. The
gazette PDF served a login page to the research session, so no rule has been read against the official text.
Regulation clause numbers are left blank because sources number the same duty differently."""
metadata_sources = ["ccc", "beacon", "powerline"]

[[sources]]
id = "cea-gazette"
title = "Central Electricity Authority: notification PDF (official text)"
url = "https://cea.nic.in/wp-content/uploads/notification/2026/08/Cyber_Regulations_Notification.pdf"
kind = "official"
read = false

[[sources]]
