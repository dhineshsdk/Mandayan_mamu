activity = "ccmp_drill"
scope = "entity"
interval = { months = 12 }
sources = ["beacon", "shieldworkz-playbook", "qrc", "powerline", "research-note", "cea-gazette"]
confidence = "corroborated"
verification = "unverified_against_gazette"
gazette_clause = ""
notes = "Scenario rotation is not checked by the engine yet."

[[rules]]
id = "CEA-IR-PLAN-REVIEW"
kind = "periodic"
topic = "governance"
title = "Incident response and recovery plan review"
summary = "The incident response and recovery plan is reviewed at least every six months."
activity = "ir_plan_review"
scope = "entity"
interval = { months = 6 }
sources = ["beacon", "shieldworkz-playbook", "qrc", "powerline", "research-note", "cea-gazette"]
confidence = "corroborated"
verification = "unverified_against_gazette"
gazette_clause = ""
notes = ""

[[rules]]
id = "CEA-ASSET-REGISTER-REVIEW"
kind = "periodic"
topic = "assets"
title = "Cyber asset register review"
summary = "The IT and OT cyber asset register is reviewed yearly or whenever an asset is commissioned or replaced."
activity = "asset_register_review"
scope = "entity"
interval = { months = 12 }
sources = ["beacon", "shieldworkz-playbook", "qrc", "powerline", "research-note", "cea-gazette"]
confidence = "corroborated"
verification = "unverified_against_gazette"
gazette_clause = ""
notes = "Only the yearly review is checked; the review owed on commissioning or replacement is not tracked yet."

[[rules]]
id = "CEA-ASSET-RISK-ASSESSMENT"
kind = "periodic"
topic = "assets"
title = "Risk assessment per asset"
summary = "Every asset has a risk assessment and mitigation plan updated at least every six months."
activity = "asset_risk_assessment"
scope = "asset"
interval = { months = 6 }
sources = ["beacon", "shieldworkz-playbook", "qrc", "powerline", "research-note", "cea-gazette"]
confidence = "corroborated"
verification = "unverified_against_gazette"
gazette_clause = ""
notes = ""

[[rules]]
id = "CEA-BACKUP-AGE"
kind = "periodic"
topic = "data"
title = "Backups of critical systems"
summary = "Online and offline backups of critical systems, no older than one month, with restoration tested."
activity = "backup"
scope = "critical_asset"
interval = { months = 1 }
sources = ["beacon", "shieldworkz-playbook", "qrc", "powerline", "research-note", "cea-gazette"]
confidence = "corroborated"
verification = "unverified_against_gazette"
gazette_clause = ""
notes = "Only backup age is checked. Sources give no frequency for restoration tests."

