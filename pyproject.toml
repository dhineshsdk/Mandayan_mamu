[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sutra"
version = "0.2.0"
description = "Root causes and rupee risk from vulnerability scanner exports, with role-based access."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "argon2-cffi>=23.1",
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "python-multipart>=0.0.9",
    "defusedxml>=0.7.1",
    "sutra-patchdraft",  # ./patchdraft in this repository; install it first (see README)
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
ai = ["sutra-patchdraft[ai]"]  # Claude drafting for patch jobs
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
sutra = "sutra.__main__:main"

[tool.setuptools.packages.find]
include = ["sutra*"]

[tool.setuptools.package-data]
sutra = ["data/*.json", "web/static/*", "app/migrations/*.ini", "app/migrations/*.py", "app/migrations/*.mako",
         "app/migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["sutra/app/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# HTML templates and synthetic-data tables read better unwrapped.
"sutra/report.py" = ["E501"]
"sutra/synth.py" = ["E501"]
