name: scan

on:
  push:
    branches: [main]
    paths: ["scan/**", ".github/workflows/scan.yml"]
  pull_request:
    paths: ["scan/**", ".github/workflows/scan.yml"]
  schedule:
    - cron: "17 3 * * 1"  # weekly: the live advisory feeds and the pinned images are checked against each other

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test]"
      - run: ruff check .
      - run: pytest

  # Real images, the live OSV feeds, and the distributions' own tools as the referee.
  containers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (rpm reads the AlmaLinux and Rocky Linux package databases)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q rpm
          python -m pip install -e ".[test]"
      - name: Version ordering against the real dpkg and rpm
        run: pytest -q tests/test_versions_native.py
      - name: Version ordering against the real apk
        run: |
          docker run --rm -v "$PWD:/w" -w /w alpine:3.19.1 sh -c \
            "apk add --no-cache python3 py3-pytest >/dev/null && PYTHONPATH=src python3 -m pytest -q -p no:cacheprovider tests/test_versions_native.py"
      - name: Known vulnerable images against the live feeds
        env:
          SUTRA_SCAN_CONTAINERS: "1"
          SUTRA_SCAN_DOCKER: "1"
        run: pytest -q tests/test_containers.py
