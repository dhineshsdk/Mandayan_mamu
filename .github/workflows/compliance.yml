name: compliance

on:
  push:
    branches: [main]
    paths: ["compliance/**", ".github/workflows/compliance.yml"]
  pull_request:
    paths: ["compliance/**", ".github/workflows/compliance.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: compliance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e '.[test]' ruff
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest
