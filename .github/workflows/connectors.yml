name: connectors

on:
  push:
    branches: [main]
    paths: ["connectors/**", ".github/workflows/connectors.yml"]
  pull_request:
    paths: ["connectors/**", "sutra/ingest/**", ".github/workflows/connectors.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    defaults:
      run:
        working-directory: connectors
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Lint
        run: ruff check .
      - name: Test
        # The repository root is on the path so the adapter tests run against the sutra app when it is present.
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: pytest
