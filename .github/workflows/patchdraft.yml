name: patchdraft

on:
  push:
    branches: [main]
    paths: ["patchdraft/**", ".github/workflows/patchdraft.yml"]
  pull_request:
    paths: ["patchdraft/**", ".github/workflows/patchdraft.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: patchdraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[ai,test]"
      - run: python -m pytest -q
      # The template path must work with no AI dependency installed.
      - run: |
          python -m pip uninstall -y anthropic
          python -c "from datetime import date; import sutra_patchdraft as p; \
          i = p.DraftInput(p.RootCauseInput('RC-1', 'single', 'k', 't', 'f'), (p.HostInput('A1', 'h1'),), (), date(2026, 10, 11)); \
          d = p.PatchDrafter(env={'ANTHROPIC_API_KEY': 'x'}).draft(i); assert d.source == 'template', d; print(d.fallback_reason)"
