[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sutra-connectors"
version = "0.1.0"
description = "Read-only API connectors for Qualys VMDR, Tenable Vulnerability Management and Tenable Security Center"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27,<1",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
