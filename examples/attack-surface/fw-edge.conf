# SAMPLE (invented), FortiOS CLI syntax
config system global
    set hostname "fw-edge"
end
config system interface
    edit "port1"
        set vdom "root"
        set ip 203.0.113.2 255.255.255.252
        set alias "WAN"
        set role wan
    next
    edit "port2"
        set vdom "root"
        set ip 10.10.0.1 255.255.0.0
        set alias "IT"
        set role lan
    next
    edit "port3"
        set vdom "root"
        set ip 10.20.0.1 255.255.255.0
        set alias "DMZ"
        set role dmz
    next
    edit "port4"
        set vdom "root"
        set ip 10.30.0.1 255.255.255.252
        set alias "TO-PLANT-FW"
    next
end
config router static
    edit 1
        set gateway 203.0.113.1
        set device "port1"
    next
    edit 2
        set dst 10.50.0.0 255.255.0.0
        set gateway 10.30.0.2
        set device "port4"
    next
end
config firewall address
    edit "IT-net"
        set subnet 10.10.0.0 255.255.0.0
    next
    edit "IT-engineering"
        set subnet 10.10.5.0 255.255.255.0
    next
    edit "DMZ-net"
        set subnet 10.20.0.0 255.255.255.0
    next
    edit "DMZ-web"
        set subnet 10.20.0.10 255.255.255.255
    next
    edit "DMZ-historian"
        set subnet 10.20.0.20 255.255.255.255
    next
    edit "OT-net"
        set subnet 10.50.0.0 255.255.0.0
    next
    edit "SCADA-vendor-host"
        set subnet 10.50.2.20 255.255.255.255
    next
    edit "SCADA-historian-db"
        set subnet 10.50.2.10 255.255.255.255
    next
end
config firewall service custom
    edit "OPC-UA"
        set tcp-portrange 4840
    next
    edit "MSSQL"
        set tcp-portrange 1433
    next
end
config firewall service group
    edit "Web-out"
        set member "HTTP" "HTTPS" "DNS"
    next
end
config firewall policy
    edit 1
        set name "Internet to DMZ web"
        set srcintf "port1"
        set dstintf "port3"
        set action accept
        set srcaddr "all"
        set dstaddr "DMZ-web"
        set schedule "always"
        set service "HTTPS"
        set logtraffic all
    next
    edit 2
        set name "IT to Internet"
        set srcintf "port2"
        set dstintf "port1"
        set action accept
        set srcaddr "IT-net"
        set dstaddr "all"
        set schedule "always"
        set service "Web-out"
        set nat enable
    next
    edit 3
        set name "IT to DMZ"
        set srcintf "port2"
        set dstintf "port3"
        set action accept
        set srcaddr "IT-net"
        set dstaddr "DMZ-net"
        set schedule "always"
        set service "ALL"
    next
    edit 4
        set name "Engineering to SCADA"
        set srcintf "port2"
        set dstintf "port4"
        set action accept
        set srcaddr "IT-engineering"
        set dstaddr "OT-net"
        set schedule "always"
        set service "RDP" "OPC-UA"
        set comments "Remote engineering sessions to the SCADA servers"
    next
    edit 5
        set name "Old project vendor tunnel"
        set srcintf "port2"
        set dstintf "port4"
        set action accept
        set srcaddr "IT-net"
        set dstaddr "OT-net"
        set schedule "always"
        set service "ALL"
        set comments "Commissioning 2019, remove after handover"
    next
    edit 6
        set name "Vendor remote support"
        set srcintf "port1"
        set dstintf "port4"
        set action accept
        set srcaddr "all"
        set dstaddr "SCADA-vendor-host"
        set schedule "always"
        set service "RDP"
    next
    edit 7
        set name "Block SSH to DMZ"
        set srcintf "port2"
        set dstintf "port3"
        set action deny
        set srcaddr "IT-net"
        set dstaddr "DMZ-net"
        set schedule "always"
        set service "SSH"
    next
    edit 8
        set name "IT web to DMZ web"
        set srcintf "port2"
        set dstintf "port3"
        set action accept
        set srcaddr "IT-net"
        set dstaddr "DMZ-web"
        set schedule "always"
        set service "HTTPS"
    next
    edit 9
        set name "Test lab"
        set srcintf "port2"
        set dstintf "port3"
        set action accept
        set srcaddr "IT-engineering"
        set dstaddr "DMZ-net"
        set schedule "always"
        set service "ALL"
        set status disable
    next
    edit 10
        set name "Historian to SCADA database"
        set srcintf "port3"
        set dstintf "port4"
        set action accept
        set srcaddr "DMZ-historian"
        set dstaddr "SCADA-historian-db"
        set schedule "always"
        set service "MSSQL"
    next
end
