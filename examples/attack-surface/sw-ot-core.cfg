! SAMPLE (invented), Cisco IOS-XE running-config syntax
!
hostname sw-ot-core
!
interface GigabitEthernet1/0/1
 description TO-FW-PLANT
 no switchport
 ip address 10.40.0.2 255.255.255.252
!
interface Vlan51
 description PLC network
 ip address 10.50.1.1 255.255.255.0
 ip access-group PLC-OUT out
!
interface Vlan52
 description SCADA network
 ip address 10.50.2.1 255.255.255.0
 ip access-group SCADA-OUT out
!
interface Vlan99
 description Spare, shut down
 ip address 10.50.99.1 255.255.255.0
 shutdown
!
ip route 0.0.0.0 0.0.0.0 10.40.0.1
!
ip access-list extended SCADA-OUT
 10 permit tcp 10.10.5.0 0.0.0.255 10.50.2.0 0.0.0.255 eq 3389
 20 permit tcp 10.10.5.0 0.0.0.255 10.50.2.0 0.0.0.255 eq 4840
 30 permit tcp host 10.20.0.20 host 10.50.2.10 eq 1433
 40 permit tcp any host 10.50.2.20 eq 3389
 50 permit ip 10.10.0.0 0.0.255.255 10.50.0.0 0.0.255.255
 60 deny ip any any log
ip access-list extended PLC-OUT
 10 permit tcp 10.50.2.0 0.0.0.255 10.50.1.0 0.0.0.255 eq 502
 20 permit tcp 10.50.2.0 0.0.0.255 10.50.1.0 0.0.0.255 eq 44818
 30 permit tcp 10.10.5.0 0.0.0.255 10.50.1.0 0.0.0.255 eq 502
 40 deny ip any any log
!
end
