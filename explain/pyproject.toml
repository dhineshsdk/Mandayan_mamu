[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sutra-explain"
version = "0.1.0"
description = "Sutra AI explanations: cited, checked explanations of root causes and board briefings, with a policy gate"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ai = ["anthropic>=1.13,<2"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S"]
ignore = ["S101", "S311", "B008"]

[tool.ruff.lint.isort]
known-first-party = ["sutra_explain"]
known-local-folder = ["helpers"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
